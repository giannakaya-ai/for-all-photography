  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 <\u002Fbutton>\n            <figcaption style=\"padding-bottom: 12px; display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-weight: 500; font-size: 25px; letter-spacing: 0.01em; color: #1a1512;\">{{ p.caption }}<\u002Fspan>\n              <span style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #b5804f;\">{{ p.meta }}<\u002Fspan>\n              <span style=\"font-weight: 300; font-size: 12.5px; line-height: 1.8; color: #4a2c1a;\">{{ p.alt }}<\u002Fspan>\n            <\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 30px 46px 84px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ nextSerie }}\" style=\"all: unset; cursor: pointer; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 28px 20px; border-top: 1px solid rgba(26,21,18,0.12); border-bottom: 1px solid rgba(26,21,18,0.12); transition: background 200ms ease;\" style-hover=\"background: rgba(221,196,168,0.3);\">\n          <span style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a6a52;\">Volgende serie<\u002Fspan>\n          <span style=\"font-weight: 400; font-size: 34px; letter-spacing: 0.01em; color: #1a1512;\">{{ nextSerieTitle }} →<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrints }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"padding: 68px 46px 40px; display: flex; flex-direction: column; gap: 22px; border-bottom: 1px solid rgba(26,21,18,0.12);\">\n        <div style=\"font-weight: 500; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #b5804f;\">Prints<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end;\">\n          <h1 style=\"margin: 0; font-weight: 500; font-size: 38px; letter-spacing: 0.01em; line-height: 1.18; color: #1a1512;\">Koop een beeld<\u002Fh1>\n          <p style=\"margin: 0; font-weight: 300; font-size: 14.5px; line-height: 2; color: #4a2c1a;\">Elk beeld is te bestellen als museumprint op mat archiefpapier, gesigneerd op de achterkant. Prints worden zonder watermerk geleverd. Levertijd ongeveer twee weken.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 44px 46px 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px;\">\n        <sc-for list=\"{{ shopItems }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.onOpen }}\" style=\"position: relative; display: block; padding: 0; border: 0; background: none; cursor: zoom-in; width: 100%;\">\n              <img src=\"{{ p.src }}\" alt=\"{{ p.alt }}\" style=\"width: 100%; height: 400px; object-fit: cover; display: block; transition: opacity 240ms ease;\" style-hover=\"opacity: 0.86;\"><span style=\"position: absolute; right: 18px; bottom: 16px; display: flex; align-items: center; gap: 5px; opacity: 0.8; pointer-events: none;\"><span style=\"font-weight: 300; font-size: 11px; letter-spacing: 0.2em; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,0.6); writing-mode: vertical-rl; transform: rotate(180deg);\">for<\u002Fspan><span style=\"font-weight: 200; font-size: 28px; letter-spacing: 0.18em; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,0.6);\">ALL<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\">\n                <span style=\"font-weight: 500; font-size: 17px; letter-spacing: 0.01em; color: #1a1512;\">{{ p.caption }}<\u002Fspan>\n                <span style=\"font-weight: 400; font-size: 15px; color: #8a5a2b;\">{{ p.price }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-weight: 300; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a6a52;\">{{ p.meta }}<\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; padding-top: 2px;\">\n                <sc-for list=\"{{ p.sizes }}\" as=\"z\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ z.onClick }}\" style=\"{{ z.style }}\">{{ z.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ p.onAdd }}\" style=\"margin-top: 6px; cursor: pointer; background: transparent; border: 1px solid #b5804f; color: #8a5a2b; font-family: Poppins, sans-serif; font-weight: 400; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; padding: 12px 20px; transition: background 180ms ease;\" style-hover=\"background: rgba(181,128,79,0.14);\">{{ p.addLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"padding: 26px 46px 90px;\">\n        <div style=\"border-top: 1px solid rgba(26,21,18,0.12); padding-top: 42px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 46px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 500; font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Druk en papier<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Giclée op 310 grams mat katoenpapier, pigmentinkt, lichtecht tot ver na ons. Zonder lijst geleverd, in een stevige koker.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 500; font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Oplage<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Elk beeld verschijnt in een oplage van vijfentwintig stuks per maat, genummerd en gesigneerd op de achterkant.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 500; font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Licenties<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Beeld voor redactioneel of commercieel gebruik gaat op licentie. Stuur een bericht met het beeldnummer en het doel, dan volgt een offerte.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCart }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding: 68px 46px 90px; min-height: 60vh;\">\n      <div style=\"display: flex; flex-direction: column; gap: 22px; border-bottom: 1px solid rgba(26,21,18,0.12); padding-bottom: 26px;\">\n        <div style=\"font-weight: 500; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #b5804f;\">Winkelmand<\u002Fdiv>\n        <h1 style=\"margin: 0; font-weight: 500; font-size: 32px; letter-spacing: 0.01em; line-height: 1.2; color: #1a1512;\">{{ cartHeading }}<\u002Fh1>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ cartEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 46px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 20px;\">\n          <p style=\"margin: 0; font-weight: 300; font-size: 15px; line-height: 2; color: #4a2c1a; max-width: 48ch;\">Er zit nog niets in je mand. Bekijk de prints en kies een beeld en een maat.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ goPrints }}\" style=\"cursor: pointer; background: transparent; border: 1px solid #b5804f; color: #8a5a2b; font-family: Poppins, sans-serif; font-weight: 400; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; padding: 13px 24px; transition: background 180ms ease;\" style-hover=\"background: rgba(181,128,79,0.14);\">Naar de prints<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ cartCount }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: 64px; align-items: start; padding-top: 34px;\">\n          <div style=\"display: flex; flex-direction: column;\">\n            <sc-for list=\"{{ cartItems }}\" as=\"c\" hint-placeholder-count=\"2\">\n              <div style=\"display: grid; grid-template-columns: 110px 1fr auto auto; gap: 22px; align-items: center; padding: 20px 4px; border-bottom: 1px solid rgba(26,21,18,0.12);\">\n                <img src=\"{{ c.src }}\" alt=\"{{ c.alt }}\" style=\"width: 110px; height: 78px; object-fit: cover;\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n                  <span style=\"font-weight: 500; font-size: 16px; color: #1a1512;\">{{ c.caption }}<\u002Fspan>\n                  <span style=\"font-weight: 300; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a6a52;\">{{ c.size }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-weight: 400; font-size: 15px; color: #8a5a2b;\">{{ c.price }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ c.onRemove }}\" style=\"cursor: pointer; background: transparent; border: 1px solid rgba(26,21,18,0.16); color: #8a6a52; font-family: Poppins, sans-serif; font-weight: 300; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 14px; transition: all 180ms ease;\" style-hover=\"border-color: #b5804f; color: #b5804f;\">Verwijder<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 22px 4px 0;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ clearCart }}\" style=\"cursor: pointer; background: transparent; border: 0; padding: 0; color: #8a6a52; font-family: Poppins, sans-serif; font-weight: 300; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;\" style-hover=\"color: #b5804f;\">Mand leegmaken<\u002Fbutton>\n              <span style=\"font-weight: 300; font-size: 12.5px; color: #4a2c1a;\">{{ shippingNote }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 22px; padding: 30px; background: #efe7dd;\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; justify-content: space-between; font-weight: 300; font-size: 13.5px; color: #4a2c1a;\">\n                <span>Subtotaal<\u002Fspan><span>{{ cartSubtotal }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; font-weight: 300; font-size: 13.5px; color: #4a2c1a;\">\n                <span>Verzending<\u002Fspan><span>{{ shipping }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height: 1px; background: rgba(26,21,18,0.14);\"><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; font-weight: 500; font-size: 18px; color: #1a1512;\">\n                <span>Totaal<\u002Fspan><span>{{ cartTotal }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-weight: 500; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #b5804f;\">Betaalmethode<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <sc-for list=\"{{ payMethods }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">\n                    <span style=\"display: flex; align-items: center; gap: 12px;\">\n                      <span style=\"{{ m.dotStyle }}\"><\u002Fspan>\n                      <span style=\"font-weight: 400; font-size: 13px; letter-spacing: 0.02em;\">{{ m.label }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-weight: 300; font-size: 10.5px; color: #8a6a52;\">{{ m.note }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ checkout }}\" style=\"cursor: pointer; background: #1a1512; border: 1px solid #1a1512; color: #f5f0ea; font-family: Poppins, sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 15px 24px; transition: background 180ms ease;\" style-hover=\"background: #33251a;\">{{ checkoutLabel }}<\u002Fbutton>\n            <p style=\"margin: 0; font-weight: 300; font-size: 11px; line-height: 1.8; color: #8a6a52;\">Betaling verloopt beveiligd. Je ontvangt een bevestiging per e-mail met het volgnummer van je print.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isOver }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"padding: 68px 46px 76px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 62px; align-items: start;\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"font-weight: 500; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #b5804f;\">Over Delilah Kaya<\u002Fdiv>\n          <h1 style=\"margin: 0; font-weight: 500; font-size: 38px; letter-spacing: 0.01em; line-height: 1.24; color: #1a1512;\">Fotografie is voor iedereen.<\u002Fh1>\n          <p style=\"margin: 0; font-weight: 300; font-size: 15px; line-height: 2; color: #4a2c1a;\">Mijn missie is simpel: verhalen vertellen vanuit elke cultuur, elk continent, elke identiteit. Verbinding staat centraal. Ik leg vast wat ons mens maakt. Overal ter wereld. Voor iedereen.<\u002Fp>\n          <p style=\"margin: 0; font-weight: 300; font-size: 15px; line-height: 2; color: #4a2c1a;\">Dansers vlak voor de eerste slag op de trom, een kind dat zich omdraait terwijl het podium achter haar oplicht, een rij ruggen die op hetzelfde moment stilvalt. Wat mij interesseert is niet het kostuum maar de mens erin: hoe een traditie er vandaag uitziet, in de stad, bij familie, op een festivalterrein.<\u002Fp>\n          <p style=\"margin: 0; font-weight: 300; font-size: 15px; line-height: 2; color: #4a2c1a;\">Ik werk het liefst mee in de stroom van de dag: geen opstellingen, geen regie, wel dichtbij. Daardoor blijven de beelden van de mensen zelf, en niet van de fotograaf.<\u002Fp>\n        <\u002Fdiv>\n        <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 12px;\">\n          <img src=\"61b59448-ecb4-4f2c-b5f9-279560efa8db\" alt=\"Jongen in het publiek, rood licht van het podium\" style=\"width: 100%; height: 540px; object-fit: cover;\">\n          <figcaption style=\"font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #3a2418;\">Publiek, tweede rij. Amsterdam<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n      <div style=\"padding: 0 46px 88px;\">\n        <div style=\"border-top: 1px solid rgba(26,21,18,0.12); padding-top: 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 46px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Festivals en optredens<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Een dag of dagdeel meelopen, van soundcheck tot laatste dans. Levering als bewerkte selectie, met beeldrecht voor de organisatie.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Portret en klederdracht<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Op locatie, in daglicht of podiumlicht. Voor dansgroepen, families en verenigingen die hun traditie willen vastleggen.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #b5804f;\">Reportage op reis<\u002Fdiv>\n            <p style=\"margin: 0; font-weight: 300; font-size: 13.5px; line-height: 1.95; color: #4a2c1a;\">Langere series rond een feest of gemeenschap, in overleg opgebouwd. Tarief en planning op aanvraag.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background: #1a1512; padding: 88px 46px 100px; min-height: 70vh;\">\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 66px; align-items: start;\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"font-weight: 300; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: #b5804f;\">Contact<\u002Fdiv>\n          <h1 style=\"margin: 0; font-weight: 500; font-size: 40px; letter-spacing: 0.01em; line-height: 1.2; color: #f5f0ea;\">Iets vast te leggen?<\u002Fh1>\n          <p style=\"margin: 0; max-width: 42ch; font-weight: 300; font-size: 14.5px; line-height: 2; color: rgba(245,240,234,0.66);\">Een festival, een optreden, een ceremonie, een portret of een familiedag. Vertel kort wat er gebeurt, waar en wanneer. Ik reageer binnen een paar dagen met een voorstel en een tarief.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 14px; font-weight: 300; font-size: 13px; color: rgba(245,240,234,0.75);\">\n            <span style=\"font-size: 18px; letter-spacing: 0.06em; color: #f5f0ea;\">Delilah Kaya<\u002Fspan>\n            <span>hallo@forallphotography.nl<\u002Fspan>\n            <span>@forall.photography<\u002Fspan>\n            <span>Amsterdam, beschikbaar in heel Nederland en daarbuiten<\u002Fspan>\n            <a href=\"https://wa.me/31600000000?text=Hoi%20Delilah%2C%20ik%20zag%20je%20portfolio%20en%20wil%20graag%20iets%20laten%20fotograferen.\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 9px; margin-top: 10px; padding: 12px 20px; border: 1px solid #b5804f; color: #ddc4a8; text-decoration: none; align-self: flex-start; font-weight: 300; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; transition: background 180ms ease;\" style-hover=\"background: rgba(181,128,79,0.18); text-decoration: none;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"#ddc4a8\" aria-hidden=\"true\">\n                <path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.47c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.21.89 2.39 1.01 2.55.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.11-.22-.17-.47-.29Z\"><\u002Fpath>\n              <\u002Fsvg>\n              Stuur een WhatsApp\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <label style=\"display: flex; flex-direction: column; gap: 8px; font-weight: 300; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245,240,234,0.6);\">Naam\n            <input type=\"text\" placeholder=\"Je naam\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(245,240,234,0.25); padding: 11px 2px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 15px; color: #f5f0ea; outline: none; letter-spacing: normal; text-transform: none;\" style-focus=\"border-bottom-color: #b5804f;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 8px; font-weight: 300; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245,240,234,0.6);\">E-mail\n            <input type=\"email\" placeholder=\"jij@voorbeeld.nl\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(245,240,234,0.25); padding: 11px 2px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 15px; color: #f5f0ea; outline: none; letter-spacing: normal; text-transform: none;\" style-focus=\"border-bottom-color: #b5804f;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 8px; font-weight: 300; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245,240,234,0.6);\">Wat en wanneer\n            <textarea rows=\"4\" placeholder=\"Bijvoorbeeld: cultureel festival, portretsessie of ceremonie, 12 juli, Den Haag\" style=\"background: transparent; border: 0; border-bottom: 1px solid rgba(245,240,234,0.25); padding: 11px 2px; font-family: Poppins, sans-serif; font-weight: 300; font-size: 15px; color: #f5f0ea; outline: none; resize: vertical; letter-spacing: normal; text-transform: none;\" style-focus=\"border-bottom-color: #b5804f;\"><\u002Ftextarea>\n          <\u002Flabel>\n          <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"align-self: flex-start; margin-top: 10px; cursor: pointer; background: transparent; border: 1px solid #b5804f; color: #ddc4a8; font-family: Poppins, sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; padding: 13px 28px; transition: background 180ms ease;\" style-hover=\"background: rgba(181,128,79,0.18);\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding: 30px 46px; display: flex; justify-content: space-between; align-items: center; font-weight: 300; font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a6a52; border-top: 1px solid rgba(26,21,18,0.12);\">\n    <span>For All Photography. Delilah Kaya.<\u002Fspan>\n    <span>Every culture. Every story. Everywhere.<\u002Fspan>\n  <\u002Fdiv>\n\n  <a href=\"https://wa.me/31600000000?text=Hoi%20Delilah%2C%20ik%20zag%20je%20portfolio%20en%20wil%20graag%20iets%20laten%20fotograferen.\" target=\"_blank\" rel=\"noopener\" aria-label=\"WhatsApp Delilah Kaya\" style=\"position: fixed; right: 26px; bottom: 26px; z-index: 80; display: flex; align-items: center; gap: 11px; padding: 13px 20px 13px 16px; background: #1a1512; border: 1px solid #b5804f; color: #f5f0ea; text-decoration: none; box-shadow: 0 8px 26px rgba(20,16,13,0.28); transition: background 200ms ease, transform 200ms ease;\" style-hover=\"background: #2a211b; transform: translateY(-2px); text-decoration: none;\">\n    <svg sc-camel-view-box=\"0 0 24 24\" width=\"21\" height=\"21\" fill=\"#ddc4a8\" aria-hidden=\"true\">\n      <path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.47c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.21.89 2.39 1.01 2.55.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.11-.22-.17-.47-.29Z\"><\u002Fpath>\n    <\u002Fsvg>\n    <span style=\"display: flex; flex-direction: column; gap: 2px;\">\n      <span style=\"font-weight: 400; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\">WhatsApp<\u002Fspan>\n      <span style=\"font-weight: 300; font-size: 9.5px; letter-spacing: 0.1em; color: rgba(245,240,234,0.6);\">Meestal binnen een uur<\u002Fspan>\n    <\u002Fspan>\n  <\u002Fa>\n\n  \n\n  <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 90; background: rgba(20,16,13,0.96); display: flex; flex-direction: column;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 20px 30px; color: rgba(245,240,234,0.66); font-weight: 300; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;\">\n        <span>{{ lightboxCounter }}<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeLightbox }}\" style=\"cursor: pointer; background: transparent; border: 1px solid rgba(245,240,234,0.28); color: #f5f0ea; font-family: Poppins, sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 9px 18px;\" style-hover=\"border-color: #b5804f; color: #ddc4a8;\">Sluiten (Esc)<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex: 1; display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; padding: 0 20px 12px; min-height: 0;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" aria-label=\"Vorige\" style=\"cursor: pointer; justify-self: center; background: transparent; border: 1px solid rgba(245,240,234,0.25); color: #f5f0ea; width: 46px; height: 46px; border-radius: 50%; font-size: 17px;\" style-hover=\"border-color: #b5804f; color: #ddc4a8;\">‹<\u002Fbutton>\n        <img src=\"{{ lightboxSrc }}\" alt=\"{{ lightboxAlt }}\" style=\"max-width: 100%; max-height: 74vh; width: auto; height: auto; margin: 0 auto; display: block; object-fit: contain;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ next }}\" aria-label=\"Volgende\" style=\"cursor: pointer; justify-self: center; background: transparent; border: 1px solid rgba(245,240,234,0.25); color: #f5f0ea; width: 46px; height: 46px; border-radius: 50%; font-size: 17px;\" style-hover=\"border-color: #b5804f; color: #ddc4a8;\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding: 0 30px 32px; text-align: center; color: rgba(245,240,234,0.7); font-weight: 300; font-size: 13px; line-height: 1.8;\">\n        <span style=\"font-size: 19px; letter-spacing: 0.03em; color: #f5f0ea;\">{{ lightboxCaption }}<\u002Fspan>\n        <span style=\"display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #b5804f; margin-top: 8px;\">{{ lightboxMeta }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst PHOTOS = [\n  { src: 'img/01-dansers-wijd.jpeg', tag: 'Dans', caption: 'Cakalele op het hoofdpodium', alt: 'Groep dansers met rode hoofddoeken op een houten podium', meta: 'Amsterdam, 2026' },\n  { src: 'img/07-danser-kapmes.jpeg', tag: 'Dans', caption: 'De eerste slag', alt: 'Danser met geheven kapmes voor het orkest', meta: 'Amsterdam, 2026' },\n  { src: 'img/05-meisje.jpeg', tag: 'Portret', caption: 'Meisje in klederdracht', alt: 'Meisje met gouden hoofdsieraad en veren, in tegenlicht', meta: 'Amsterdam, 2026' },\n  { src: 'img/02-zanger.jpeg', tag: 'Podium', caption: 'Laatste refrein', alt: 'Zanger met microfoon in warm podiumlicht', meta: 'Amsterdam, 2026' },\n  { src: 'img/08-rij-ruggen.jpeg', tag: 'Dans', caption: 'Stilte tussen twee dansen', alt: 'Rij dansers van achteren gezien, armen ineengehaakt', meta: 'Amsterdam, 2026' },\n  { src: 'img/06-jongen.jpeg', tag: 'Portret', caption: 'Tweede rij', alt: 'Jongen in het publiek, rood licht op zijn gezicht', meta: 'Amsterdam, 2026' },\n  { src: 'img/03-mc.jpeg', tag: 'Podium', caption: 'De MC', alt: 'Artiest met zonnebril en microfoon op het podium', meta: 'Amsterdam, 2026' },\n  { src: 'img/04-danser-loopt.jpeg', tag: 'Dans', caption: 'Over het podium', alt: 'Danser loopt met stok over het podium in de zon', meta: 'Amsterdam, 2026' }\n];\n\nconst SERIES = [\n  { num: '01', title: 'Cakalele', tag: 'Dans', note: 'Krijgsdans, van repetitie tot podium.', thumb: 'img/08-rij-ruggen.jpeg',\n    intro: 'De cakalele is een krijgsdans: rode hoofddoek, kapmes, blote voeten op hout. Wat me trof is hoe zacht het eromheen is: het wachten, het schouderklopje, de stilte vlak voor de trom. Deze serie volgt een middag, van de eerste opstelling tot de laatste pas.' },\n  { num: '02', title: 'Kleine gezichten', tag: 'Portret', note: 'Kinderen die een traditie erven.', thumb: 'img/05-meisje.jpeg',\n    intro: 'Kinderen dragen een traditie zonder er iets van te vinden: ze staan er gewoon in, in goud en veren, of kijken vanaf de tweede rij toe. Deze portretten zijn gemaakt tussen de optredens door, zonder regie.' },\n  { num: '03', title: 'Podiumlicht', tag: 'Podium', note: 'Artiesten in het laatste uur zon.', thumb: 'img/03-mc.jpeg',\n    intro: 'Het laatste uur voor zonsondergang is het mooiste licht van de dag, en precies het moment dat het podium losgaat. Deze serie gaat over dat uur: warm tegenlicht, zweet, een microfoon en een publiek dat meezingt.' }\n];\n\nconst FILTERS = ['Alles', 'Dans', 'Portret', 'Podium'];\nconst HERO = [0, 2, 4];\nconst NAV = [\n  { key: 'home', label: 'Home' },\n  { key: 'werk', label: 'Werk' },\n  { key: 'prints', label: 'Prints' },\n  { key: 'over', label: 'Over' },\n  { key: 'contact', label: 'Contact' }\n];\n\nconst PAY = [\n  { label: 'iDEAL', note: 'Alle Nederlandse banken' },\n  { label: 'Creditcard', note: 'Visa en Mastercard' },\n  { label: 'PayPal', note: 'Kopersbescherming' },\n  { label: 'Bancontact', note: 'België' },\n  { label: 'Apple Pay', note: 'Snel afrekenen' }\n];\n\nconst SIZES = [\n  { label: '30 × 40', price: 95 },\n  { label: '50 × 70', price: 165 },\n  { label: '70 × 100', price: 260 }\n];\n\nclass Component extends DCLogic {\n  state = { page: 'home', serie: 0, filter: 'Alles', hero: 0, lightbox: -1, sent: false, sizes: {}, cart: [], pay: 0, paid: false };\n\n  componentDidMount() {\n    this._timer = setInterval(() => {\n      if (this.state.lightbox < 0 && this.state.page === 'home') {\n        this.setState(s => ({ hero: (s.hero + 1) % HERO.length }));\n      }\n    }, 5200);\n    this._key = e => {\n      if (this.state.lightbox < 0) return;\n      if (e.key === 'Escape') this.setState({ lightbox: -1 });\n      if (e.key === 'ArrowRight') this.step(1);\n      if (e.key === 'ArrowLeft') this.step(-1);\n    };\n    window.addEventListener('keydown', this._key);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    window.removeEventListener('keydown', this._key);\n  }\n\n  go(page, extra) {\n    this.setState(Object.assign({ page: page, lightbox: -1 }, extra || {}));\n    window.scrollTo(0, 0);\n  }\n\n  gridList() {\n    return this.state.filter === 'Alles' ? PHOTOS : PHOTOS.filter(p => p.tag === this.state.filter);\n  }\n\n  serieList() {\n    return PHOTOS.filter(p => p.tag === SERIES[this.state.serie].tag);\n  }\n\n  activeList() {\n    if (this.state.page === 'serie') return this.serieList();\n    if (this.state.page === 'werk') return this.gridList();\n    if (this.state.page === 'prints') return PHOTOS;\n    return PHOTOS.slice(0, 3);\n  }\n\n  sizeOf(n) {\n    return this.state.sizes[n] === undefined ? 1 : this.state.sizes[n];\n  }\n\n  addToCart(n) {\n    const item = { photo: n, size: this.sizeOf(n) };\n    this.setState(s => ({ cart: s.cart.concat([item]) }));\n  }\n\n  step(d) {\n    const n = this.activeList().length;\n    this.setState(s => ({ lightbox: (s.lightbox + d + n) % n }));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const i = st.lightbox;\n    const cur = i >= 0 ? this.activeList()[i] : null;\n    const s = SERIES[st.serie];\n    const nextIdx = (st.serie + 1) % SERIES.length;\n    const withOpen = arr => arr.map((p, n) => Object.assign({}, p, { onOpen: () => this.setState({ lightbox: n }) }));\n    const subtotal = st.cart.reduce((t, c) => t + SIZES[c.size].price, 0);\n\n    return {\n      isHome: st.page === 'home',\n      isWerk: st.page === 'werk',\n      isSerie: st.page === 'serie',\n      isPrints: st.page === 'prints',\n      isOver: st.page === 'over',\n\n      shopItems: PHOTOS.map((p, n) => ({\n        src: p.src,\n        alt: p.alt,\n        caption: p.caption,\n        meta: p.meta + '. ' + p.tag,\n        price: '€ ' + SIZES[this.sizeOf(n)].price,\n        onOpen: () => this.setState({ lightbox: n }),\n        onAdd: () => this.addToCart(n),\n        addLabel: st.cart.filter(c => c.photo === n).length > 0 ? 'Nog een toevoegen' : 'In winkelmand',\n        sizes: SIZES.map((z, zi) => ({\n          label: z.label,\n          onClick: () => this.setState(s => {\n            const next = Object.assign({}, s.sizes);\n            next[n] = zi;\n            return { sizes: next };\n          }),\n          style: 'cursor:pointer;font-family:Poppins,sans-serif;font-weight:300;font-size:9.5px;letter-spacing:0.12em;padding:7px 11px;background:transparent;transition:all 180ms ease;'\n            + (this.sizeOf(n) === zi\n              ? 'border:1px solid #b5804f;color:#b5804f;'\n              : 'border:1px solid rgba(26,21,18,0.16);color:#8a6a52;')\n        }))\n      })),\n\n      isCart: st.page === 'cart',\n      goCart: () => this.go('cart'),\n      goPrints: () => this.go('prints'),\n      cartBadge: st.cart.length > 0 ? String(st.cart.length) : '',\n      cartBtnStyle: 'cursor:pointer;display:flex;align-items:center;gap:7px;background:transparent;font-family:Poppins,sans-serif;padding:8px 13px;margin-left:6px;transition:all 180ms ease;'\n        + (st.page === 'cart'\n          ? 'border:1px solid #b5804f;color:#b5804f;'\n          : (st.cart.length > 0 ? 'border:1px solid #b5804f;color:#8a5a2b;' : 'border:1px solid rgba(26,21,18,0.16);color:#8a6a52;')),\n\n      cartCount: st.cart.length > 0,\n      cartEmpty: st.cart.length === 0,\n      cartHeading: st.paid\n        ? 'Bedankt voor je bestelling'\n        : (st.cart.length === 0 ? 'Nog leeg' : st.cart.length + (st.cart.length === 1 ? ' print klaar om te bestellen' : ' prints klaar om te bestellen')),\n      cartItems: st.cart.map((c, n) => ({\n        src: PHOTOS[c.photo].src,\n        alt: PHOTOS[c.photo].alt,\n        caption: PHOTOS[c.photo].caption,\n        size: SIZES[c.size].label + ' cm, museumprint',\n        price: '€ ' + SIZES[c.size].price,\n        onRemove: () => this.setState(s => ({ cart: s.cart.filter((x, xi) => xi !== n) }))\n      })),\n      cartSubtotal: '€ ' + subtotal,\n      shipping: subtotal >= 200 ? 'Gratis' : '€ 9,50',\n      shippingNote: subtotal >= 200 ? 'Verzending is gratis vanaf € 200.' : 'Nog € ' + (200 - subtotal) + ' tot gratis verzending.',\n      cartTotal: '€ ' + (subtotal >= 200 ? subtotal : subtotal + 9.5).toFixed(2).replace('.', ','),\n      payMethods: PAY.map((m, n) => ({\n        label: m.label,\n        note: m.note,\n        onClick: () => this.setState({ pay: n, paid: false }),\n        style: 'cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;box-sizing:border-box;background:#f5f0ea;font-family:Poppins,sans-serif;color:#1a1512;text-align:left;padding:13px 16px;transition:all 180ms ease;'\n          + (st.pay === n ? 'border:1px solid #b5804f;' : 'border:1px solid rgba(26,21,18,0.14);'),\n        dotStyle: 'width:11px;height:11px;border-radius:50%;box-sizing:border-box;'\n          + (st.pay === n ? 'border:3px solid #b5804f;background:#f5f0ea;' : 'border:1px solid rgba(26,21,18,0.3);background:transparent;')\n      })),\n      checkoutLabel: st.paid ? 'Bestelling ontvangen' : 'Afrekenen met ' + PAY[st.pay].label,\n      checkout: () => this.setState({ paid: true }),\n      clearCart: () => this.setState({ cart: [], paid: false }),\n\n      isContact: st.page === 'contact',\n\n      goHome: () => this.go('home'),\n      goWerk: () => this.go('werk'),\n      goContact: () => this.go('contact'),\n\n      nav: NAV.map(n => ({\n        label: n.label,\n        onClick: () => this.go(n.key),\n        style: 'cursor:pointer;background:transparent;border:0;font-family:Poppins,sans-serif;font-weight:300;font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;padding:9px 13px;transition:color 180ms ease;'\n          + (st.page === n.key || (n.key === 'home' && st.page === 'serie')\n            ? 'color:#1a1512;border-bottom:1px solid #b5804f;'\n            : 'color:#8a6a52;border-bottom:1px solid transparent;')\n      })),\n\n      heroSlides: HERO.map((idx, n) => ({\n        src: PHOTOS[idx].src,\n        alt: PHOTOS[idx].alt,\n        style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1400ms ease;opacity:' + (n === st.hero ? 1 : 0)\n      })),\n      heroDots: HERO.map((idx, n) => ({\n        label: 'Beeld ' + (n + 1),\n        onClick: () => this.setState({ hero: n }),\n        style: 'cursor:pointer;width:34px;height:1px;border:0;padding:0;transition:background 300ms ease;background:' + (n === st.hero ? '#ddc4a8' : 'rgba(245,240,234,0.32)')\n      })),\n\n      featured: withOpen(PHOTOS.slice(0, 3)),\n\n      filters: FILTERS.map(f => ({\n        label: f,\n        onClick: () => this.setState({ filter: f, lightbox: -1 }),\n        style: 'cursor:pointer;font-family:Poppins,sans-serif;font-weight:300;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;padding:10px 20px;background:transparent;transition:all 180ms ease;'\n          + (f === st.filter\n            ? 'border:1px solid #b5804f;color:#b5804f;'\n            : 'border:1px solid rgba(26,21,18,0.18);color:#8a6a52;')\n      })),\n      visible: withOpen(this.gridList()),\n\n      seriesRows: SERIES.map((r, n) => ({\n        num: r.num,\n        title: r.title,\n        note: r.note,\n        thumb: r.thumb,\n        count: PHOTOS.filter(p => p.tag === r.tag).length + ' beelden',\n        onClick: () => this.go('serie', { serie: n })\n      })),\n      serieNum: s.num,\n      serieTitle: s.title,\n      serieIntro: s.intro,\n      seriePhotos: withOpen(this.serieList()),\n      nextSerieTitle: SERIES[nextIdx].title,\n      nextSerie: () => this.go('serie', { serie: nextIdx }),\n\n      submitLabel: st.sent ? 'Verstuurd. Dank je' : 'Versturen',\n      submit: () => this.setState({ sent: true }),\n\n      lightboxOpen: i >= 0,\n      lightboxSrc: cur ? cur.src : '',\n      lightboxAlt: cur ? cur.alt : '',\n      lightboxCaption: cur ? cur.caption : '',\n      lightboxMeta: cur ? cur.meta + '. ' + cur.tag : '',\n      lightboxCounter: cur ? (i + 1) + ' / ' + this.activeList().length : '',\n      closeLightbox: () => this.setState({ lightbox: -1 }),\n      next: () => this.step(1),\n      prev: () => this.step(-1)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
